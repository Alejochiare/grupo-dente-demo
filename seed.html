<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRUPO DENTE CRM — Cargar datos de demo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;padding:1rem;min-height:100vh;}
    .wrap{width:100%;max-width:460px;}
    .card{background:var(--surface);border:1px solid var(--border-md);border-radius:var(--radius-lg);padding:2rem;text-align:center;}
    .card h1{font-family:var(--font-display);font-size:18px;margin-bottom:.75rem;}
    .card p{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:1.25rem;}
    #out{margin-top:1rem;font-size:12px;color:var(--text-3);white-space:pre-wrap;}
    #out.ok{color:var(--green,#3a7a4a);}
    #out.err{color:var(--red,#e05555);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Cargar datos de demo</h1>
      <p>
        Esto escribe clientes, vehículos y usuarios <strong>ficticios</strong> en el
        Firestore configurado en <code>js/firebase-init.js</code>, para que la demo
        arranque poblada. Usa IDs fijos: correrlo de nuevo resetea la demo a este
        mismo estado inicial, no duplica nada.
      </p>
      <button class="btn primary btn-full" id="btn-seed" onclick="runSeed()">Cargar datos de demo</button>
      <div id="out"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/seed-demo-data.js"></script>
  <script>
    async function runSeed() {
      const btn = document.getElementById('btn-seed');
      const out = document.getElementById('out');
      btn.disabled = true;
      out.className = '';
      out.textContent = 'Cargando...';
      try {
        const r = await seedDemoData();
        out.className = 'ok';
        out.textContent = `Listo — ${r.usuarios} usuarios, ${r.clientes} clientes, ${r.vehiculos} vehículos.\nUsuarios de prueba: admin / demo2026  ·  vendedor / demo2026\nYa podés ir a login.html`;
      } catch (e) {
        out.className = 'err';
        out.textContent = 'Error: ' + e.message + '\n¿Ya pegaste el firebaseConfig en js/firebase-init.js y activaste Firestore en modo prueba?';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
