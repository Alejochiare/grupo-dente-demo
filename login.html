<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRUPO DENTE CRM — Acceso</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;padding:1rem;min-height:100vh;}
    .login-wrap{width:100%;max-width:400px;animation:fadeUp .3s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .logo-wrap{text-align:center;margin-bottom:2.5rem;}
    .logo-big{font-family:var(--font-display);font-size:30px;font-weight:600;color:var(--text);}
    .logo-big span{color:var(--gold);}
    .logo-sub2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-top:4px;}
    .login-card{background:var(--surface);border:1px solid var(--border-md);border-radius:var(--radius-lg);padding:2rem;}
    .login-title{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:1.5rem;color:var(--text);}
    .err{background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius);color:var(--red);font-size:13px;padding:10px 12px;margin-bottom:14px;display:none;}
    .err.show{display:block;}
    .hint{font-size:11px;color:var(--text-3);text-align:center;margin-top:1rem;}
    .btn-full{width:100%;margin-top:4px;padding:11px;font-size:13px;}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo-wrap">
      <div class="logo-big">GRUPO DENTE<span>.</span>CRM</div>
      <div class="logo-sub2">Sistema de Gestión Automotor</div>
    </div>
    <div class="login-card">
      <div class="login-title">Iniciar sesión</div>
      <div class="err" id="err">Usuario o contraseña incorrectos.</div>
      <div class="fg">
        <label>Usuario</label>
        <input type="text" id="uname" placeholder="tu usuario" autocomplete="username">
      </div>
      <div class="fg">
        <label>Contraseña</label>
        <input type="password" id="upass" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn primary btn-full" id="btn-login" onclick="doLogin()">Ingresar</button>
      <div class="hint">Contactá al administrador si no recordás tu acceso.</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script>
    /* Si ya hay sesión válida, ir directo al dashboard */
    if (localStorage.getItem('crm_session')) {
      window.location.href = 'dashboard.html';
    }

    /* Modo demo: la contraseña se compara contra el campo "pass" del
       documento en Firestore (colección "usuarios"). No es un login
       seguro de verdad — con las reglas de Firestore en modo prueba
       cualquiera con la URL del proyecto puede leer/escribir toda la
       base igual, así que un hash acá no aportaría seguridad real.
       Ver README.md antes de usar esto con datos reales de un cliente. */
    async function doLogin() {
      const u    = document.getElementById('uname').value.trim();
      const p    = document.getElementById('upass').value;
      const btn  = document.getElementById('btn-login');
      const errEl= document.getElementById('err');

      if (!u || !p) { errEl.textContent='Completá usuario y contraseña.'; errEl.classList.add('show'); return; }

      btn.disabled = true;
      btn.textContent = 'Ingresando…';
      errEl.classList.remove('show');

      try {
        const snap = await firebase.firestore().collection('usuarios')
          .where('user', '==', u).limit(1).get();

        const doc = !snap.empty ? snap.docs[0].data() : null;
        if (!doc || doc.activo === false || doc.pass !== p) {
          errEl.textContent = 'Usuario o contraseña incorrectos.';
          errEl.classList.add('show');
          document.getElementById('upass').value = '';
          document.getElementById('upass').focus();
        } else {
          localStorage.setItem('crm_session', JSON.stringify({
            nombre: doc.nombre,
            role:   doc.role,
            user:   doc.user,
          }));
          window.location.href = 'dashboard.html';
        }
      } catch (e) {
        errEl.textContent = 'Error de conexión con Firebase. Revisá la consola.';
        errEl.classList.add('show');
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    }
  </script>
</body>
</html>
